name: PR Rules

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
            build
            style
          requireScope: false

  branch-name:
    name: Branch naming convention
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          if echo "$BRANCH" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|perf|build)/[a-z0-9._-]+$'; then
            echo "Branch name '$BRANCH' is valid."
          elif echo "$BRANCH" | grep -qE '^(main|develop|release/.+)$'; then
            echo "Branch name '$BRANCH' is a protected branch — OK."
          else
            echo "::error::Branch name '$BRANCH' does not match conventions."
            echo "Expected: feat/*, fix/*, docs/*, chore/*, etc."
            exit 1
          fi
